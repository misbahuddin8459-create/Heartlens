<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeartLens — Privacy-First Relationship Clarity</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px 60px;
        background: transparent;
        color: #ffffff;
        position: relative;
        min-height: 100vh;
      }

      /* Full-screen background video */
      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
      }

      /* Subtle dark tint so white text stays readable over any video */
      .video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.42);
        z-index: -1;
        pointer-events: none;
      }

      /* Floating sound toggle button */
      #soundBtn {
        position: fixed;
        top: 18px;
        right: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        z-index: 10;
        margin-top: 0;
      }

      #soundBtn:hover {
        background: rgba(0, 0, 0, 0.6);
      }

      /* Transparent HeartLens container */
      .heartlens-container {
        background: transparent;
        padding: 12px 0;
      }

      h1, h2, p {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
        background: rgba(109, 40, 217, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
        color: #ffffff;
      }

      .badge.tone {
        background: rgba(3, 105, 161, 0.45);
      }

      /* ONLY the input box stays solid white (same as before) */
      textarea {
        width: 100%;
        height: 140px;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #d4d4d8;
        background: #ffffff;
        color: #1f1b24;
        font-size: 1rem;
        font-family: inherit;
      }

      .hint {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.85);
        margin-top: 6px;
      }

      #analyzeBtn {
        margin-top: 12px;
        padding: 12px 22px;
        border: none;
        border-radius: 8px;
        background: #6d28d9;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      #analyzeBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Transparent glass result & history boxes */
      #result {
        margin-top: 24px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        white-space: pre-wrap;
        line-height: 1.6;
        display: none;
      }

      .history-section {
        margin-top: 40px;
      }

      .history-card {
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
      }

      .history-meta {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 6px;
      }

      .history-situation {
        font-weight: 600;
        margin-bottom: 8px;
        color: #ffffff;
      }

      .history-response {
        white-space: pre-wrap;
        font-size: 0.92rem;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.92);
      }
    </style>
  </head>
  <body>
    <!-- Background Video -->
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="/bg.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>

    <!-- Sound Toggle Button -->
    <button id="soundBtn" type="button">🔇 Sound Off</button>

    <div class="heartlens-container">
      <h1>HeartLens</h1>
      <p>Describe a relationship concern or paste a confusing text. Your thoughts stay private on-device whenever supported.</p>

      <div class="badges">
        <div id="modeBadge" class="badge">Checking AI mode...</div>
        <div id="toneBadge" class="badge tone">Tone: loading...</div>
      </div>

      <textarea
        id="situationInput"
        placeholder="Example: They read my message 5 hours ago and didn't reply, even though they posted an Instagram story..."
      ></textarea>
      <div class="hint">Press <strong>Enter</strong> to analyze • <strong>Shift + Enter</strong> for a new line</div>

      <button id="analyzeBtn">Analyze Situation</button>

      <div id="result"></div>

      <div class="history-section">
        <h2>Your Private Reflections</h2>
        <div id="historyList">Loading saved reflections...</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
